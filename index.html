
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>insane // digital identity</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:monospace;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ff152008 4px 5px)}
main{width:min(90%,650px);padding:30px 24px;border:1px solid #7e1824;background:#0b0b0bee;box-shadow:0 0 45px #b20c2225;position:relative}
.tag{color:#ff334b;font-size:12px;letter-spacing:3px}
h1{font-size:clamp(42px,12vw,76px);margin:18px 0;color:#ff263f;text-shadow:0 0 22px #f00129;letter-spacing:5px}
.line{height:1px;background:linear-gradient(90deg,#f22,transparent);margin:22px 0}
p{color:#aaa;line-height:1.8}
.prompt{color:#ff4055}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
a{color:#ff4055;text-decoration:none;border:1px solid #86202c;padding:12px 15px}
a:hover{background:#c7192d;color:white}
footer{margin-top:35px;color:#666;font-size:11px}
#clock{color:#ff4055}
</style>
</head>
<body>
<main>
<div class="tag">INSANE SYSTEMS // PORTFOLIO</div>
<h1>INSANE<span style="color:#eee">_</span></h1>
<div class="line"></div>
<p class="prompt">root@insane:~$ whoami</p>
<p>uma identidade fora do sistema<br>bem-vindo ao meu espaço digital</p>
<p class="prompt">root@insane:~$ system_status</p>
<p>STATUS: ONLINE<br>MODE: NIGHT<br>ACCESS: GRANTED</p>
<div class="line"></div>
<div class="tag">/// ESTABLISH CONNECTION</div>
<div class="links">
<a href="https://discord.com/app">DISCORD ↗</a>
<a href="https://github.com/">GITHUB ↗</a>
</div>
<footer>INSANE © <span id="year"></span> // ALL SYSTEMS NOMINAL<br>LOCAL TIME: <span id="clock"></span></footer>
</main>
<script>
document.getElementById("year").textContent=new Date().getFullYear();
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("pt-BR")}
tick();setInterval(tick,1000);
</script>
</body>
</html>
